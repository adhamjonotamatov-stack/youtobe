<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Search App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <button class="navbar-btn" type="button">▶ MyTube</button>

      <form class="navbar-form">
        <input
          type="text"
          class="navbar-form-input"
          placeholder="Search videos..."
          required
        />
        <button class="navbar-form-btn" type="submit">Qidirish</button>
      </form>
    </nav>

    <main class="main">
      <p class="status"></p>
      <div class="videos">
        <h2 class="videos-title">Qidiruv natijalari</h2>
        <div class="videos-video"></div>
      </div>

      <div class="video-clicked hidden">
        <button class="video-clicked-Return-btn" type="button">
          ← Natijalarga qaytish
        </button>
        <div class="video-contenr">
          <div class="video-clicked-content">
            <div class="video-clicked-content-player"></div>
            <h2 class="video-clicked-content-title"></h2>
            <p class="video-clicked-content-text"></p>
          </div>

          <div class="video-clicked-content-footer">
            <h3 class="video-clicked-content-footer-title">
              O‘xshash videolar
            </h3>
            <p class="video-clicked-content-footer-text"></p>
            <div class="video-clicked-content-footer-videos"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
